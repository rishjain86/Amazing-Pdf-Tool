name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Auto-Copy Files to Public for App Build
      run: |
        mkdir -p public
        cp *.html public/ || true
        cp *.js public/ || true
        cp *.css public/ || true
        cp -r assets public/ || true

    - name: Create Android Project
      run: npx cap add android || true

    - name: Generate App Icons & Splash
      run: npx @capacitor/assets generate || true

    - name: Sync App Code
      run: npx cap sync android

    - name: Inject AdMob App ID Automatically
      run: |
        sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6519206650027176~4620229874"/>' android/app/src/main/AndroidManifest.xml

    - name: Grant Execute Permission for Gradle
      run: chmod +x android/gradlew

    - name: Build APK File
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: Amazing-PDF-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
